apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: urtask
  namespace: urtask
  labels:
    app: urtask
spec:
  serviceName: urtask
  replicas: 1
  selector:
    matchLabels:
      app: urtask
  template:
    metadata:
      labels:
        app: urtask
      annotations:
        vault.hashicorp.com/agent-inject: 'true'
        vault.hashicorp.com/role: 'urtask-dev'
        vault.hashicorp.com/agent-pre-populate-only: 'true'
        vault.hashicorp.com/agent-inject-secret-env-config: 'kv/urtask-dev'
        vault.hashicorp.com/agent-inject-template-env-config: |
           {{ with secret "kv/urtask-dev" -}}
              {{- range $key, $value := .Data.data }}
                export {{ $key }}="{{ $value }}"
              {{- end }}
            {{- end }}
    spec:
      serviceAccountName: urtask-dev-auth
      containers:
        - name: urtask
          image: ideavn/urtask:{latest}
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi